[package]
name = "threedesco"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Simple tool to decode/encode \"type 3\" reversible config passwords"
authors = ["Hunter Wigelsworth <wiggels@gmail.com>"]
license = "MIT"
repository = "https://github.com/wiggels/3desco"
readme = "README.md"
keywords = ["3des", "password", "decode", "cli", "security"]
categories = ["command-line-utilities", "cryptography"]
# published to crates.io as a library (`threedesco`) plus a binary (`3desco`).
# keep CI/build/container files out of the published .crate.
exclude = [".github/", "Dockerfile", ".dockerignore", "release-plz.toml", "deny.toml"]

# library target: src/lib.rs is picked up automatically as `threedesco`.

[[bin]]
name = "3desco"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
des = "0.9"
cbc = "0.2"
