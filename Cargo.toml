[package]
name = "three-desco"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Simple tool to decode/encode \"type 3\" reversible config passwords"
authors = ["Hunter Wigelsworth <wiggels@gmail.com>"]
license = "MIT"
repository = "https://github.com/wiggels/3desco"
readme = "README.md"
keywords = ["3des", "password", "decode", "cli", "security"]
categories = ["command-line-utilities", "cryptography"]
# NOTE: crates.io publishing is disabled in release-plz.toml (publish = false
# there), NOT with Cargo's own `publish = false` -- the latter makes release-plz
# skip the package entirely, so it would never tag or cut a GitHub release.

[[bin]]
name = "3desco"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
des = "0.9"
cbc = "0.2"
