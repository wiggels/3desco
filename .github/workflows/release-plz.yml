name: Release

# release-plz automates versioning from conventional commits. because this
# project ships as a container image, NOT a crate, cargo publish is disabled
# (publish = false in Cargo.toml). release-plz still:
#
# * on every push to main, opens/updates a "chore: release vX.Y.Z" PR that
#   bumps the version in Cargo.toml, updates CHANGELOG.md, and the lockfile
# * merging that PR creates the vX.Y.Z git tag and a GitHub release
#
# the tag then triggers docker.yml, which builds and pushes the image tagged
# with that version.
#
# ## one time setup
#
# 1. settings -> actions -> general -> workflow permissions -> read and write
# 2. (recommended) a fine-grained PAT with contents:write + pull_requests:write
#    stored as secret RELEASE_PLZ_TOKEN, so the release PR's push triggers CI.
#    GITHUB_TOKEN also works but will not start other workflows on the PR.
# 3. branch protection on main requiring the "all checks" gate.
#
# no crates.io token is needed -- nothing is published to a registry.

on:
  push:
    branches: [main]

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"

jobs:
  # ---------------------------------------------------------------------------
  # preflight -- block a release if the tree is red
  # ---------------------------------------------------------------------------
  preflight:
    name: preflight (gate release on tests + audit)
    if: ${{ github.repository_owner == 'wiggels' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: cargo test
        run: cargo test --all-targets --locked
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # ---------------------------------------------------------------------------
  # create the tag + GitHub release when the release PR is merged
  # ---------------------------------------------------------------------------
  release-plz-release:
    name: release-plz release
    if: ${{ github.repository_owner == 'wiggels' }}
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---------------------------------------------------------------------------
  # open / update the next release PR. idempotent, not gated on preflight --
  # opening a PR is harmless when the tree is red and the PR gets its own CI.
  # ---------------------------------------------------------------------------
  release-plz-pr:
    name: release-plz PR
    if: ${{ github.repository_owner == 'wiggels' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      # before the first crates.io publish, release-pr cannot diff against a
      # registry baseline ("failed to retrieve difference") -- skip it until the
      # crate exists. the release job below performs the initial publish.
      - name: Check for a crates.io baseline
        id: baseline
        run: |
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          if cargo search "$name" --limit 1 | grep -q "^$name = "; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$name not on crates.io yet; skipping release-pr (release job does the first publish)."
          fi
      - name: Run release-plz
        if: steps.baseline.outputs.published == 'true'
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
