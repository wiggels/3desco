name: Docker

# builds the minimal 3desco image and pushes it to the GitHub Container
# Registry. images are ONLY published for released versions: a vX.Y.Z tag (cut
# by release-plz when a release PR merges) publishes :X.Y.Z, :X.Y, and :latest.
# pushes to main do NOT publish an image -- :latest always points at a real
# tagged release, never an arbitrary main commit. (The CI workflow still builds
# the image on every PR/push to catch a broken Dockerfile, it just never pushes.)
#
# no secrets to configure -- GITHUB_TOKEN with packages:write is enough to
# push to ghcr.io/wiggels/3desco.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wiggels/3desco
          # latest=auto tags :latest on the newest non-prerelease semver tag
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # add linux/arm64 here for multi-arch (slower: emulated musl build)
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
